[versions]
# Android Gradle Plugin / Gradle (CI workflow pins the matching Gradle 8.13)
agp = "8.13.2"
# Kotlin & KSP (KSP version must track the Kotlin version)
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
# JSON for the KB seed importer (pure-JVM parse, unit-testable)
kotlinxSerialization = "1.10.0"
# Dependency injection
# NOTE: Hilt Gradle plugin >= 2.59 requires AGP 9 (which itself requires Gradle 9.1+).
# While we're on AGP 8.x, pin to the last AGP-8-compatible Hilt line (2.57.x).
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
# Compose
# NOTE: BOM >= 2026.08.00 pulls compose 1.12.x, which requires compileSdk 37
# (AGP 8.x maxes out at 36). 2026.06.01 is the newest AGP-8-compatible BOM.
composeBom = "2026.06.01"
# AndroidX app libraries
activityCompose = "1.13.0"
# NOTE: navigation 2.10.x requires compileSdk 37; 2.9.x is the last AGP-8-compatible line.
navigationCompose = "2.9.8"
# NOTE: lifecycle 2.11.0 requires compileSdk 37; 2.10.0 is the last AGP-8-compatible release.
lifecycleRuntimeKtx = "2.10.0"
coreKtx = "1.15.0"
# Persistence (Room) — 2.8.5 verified minCompileSdk=34 (AGP-8-compatible), supports KSP2.
room = "2.8.5"
# AndroidX instrumented-test tooling
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
# Static analysis & testing
detekt = "1.23.7"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
