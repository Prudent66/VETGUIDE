name: PR checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: gitleaks needs parent commits to scan multi-commit push ranges.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          # Gradle dependency/build caching is automatic in setup-gradle v4.
          # Overwrite the cached Gradle Home: a partially written dependency
          # cache (module metadata present, jar files missing) made unit-test
          # classpath resolution fail with "Could not find junit-4.13.2.jar"
          # even though the artifact exists on Maven Central.
          cache-overwrite-existing: true

      # gitleaks CLI (Apache-2.0, no license key) instead of gitleaks-action@v2:
      # the action requires a GITLEAKS_LICENSE and fails spuriously with
      # "missing gitleaks license" whenever GitHub's API rate-limits the runner
      # (it cannot resolve the repo owner), which was the only recurring
      # pipeline flake. The CLI scans the same full git history and exits 1 on
      # any finding, so the §8 gate is unchanged.
      - name: Secret scan (roadmap §8 — no credentials in history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner --verbose

      - name: Static analysis (detekt)
        run: gradle detekt

      - name: Unit tests
        # --refresh-dependencies re-validates the restored dependency cache and
        # re-downloads any artifact whose cached jar is missing, so a poisoned
        # cache entry can never wedge the pipeline again.
        run: gradle testDebugUnitTest --refresh-dependencies

      - name: Build debug APK
        run: gradle assembleDebug

      # ---------------------------------------------------------------------
      # Signed release bundle (Google Play) + release APK (tester updates).
      #
      # bundleRelease and assembleRelease share the SAME release signing
      # config, so the release APK installs in-place over any previous
      # release-signed build — no uninstall, Room database data survives.
      # (The debug APK uses a fresh ephemeral runner keystore and therefore
      # cannot update a release-signed installation.)
      #
      # Secrets (Settings → Secrets and variables → Actions):
      #   KEYSTORE_BASE64     base64 of vetguide-release.jks
      #   KEYSTORE_PASSWORD   keystore password
      #   KEY_ALIAS           key alias inside the keystore
      #   KEY_PASSWORD        key password
      #
      # Without KEYSTORE_BASE64 the same tasks still run and produce an
      # unsigned AAB/APK, so R8/resource-shrinking is validated on every push.
      # ---------------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::KEYSTORE_BASE64 is not set — building an unsigned AAB/APK for now."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vetguide-release.jks"
          test -s "$RUNNER_TEMP/vetguide-release.jks"

      - name: Build release bundle (AAB — signed when keystore secrets exist)
        env:
          VETGUIDE_KEYSTORE_PATH: ${{ runner.temp }}/vetguide-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Build release APK (signed when keystore secrets exist)
        env:
          VETGUIDE_KEYSTORE_PATH: ${{ runner.temp }}/vetguide-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify AAB signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No keystore configured — AAB is unsigned; add the four secrets to sign."
            exit 0
          fi
          jarsigner -verify "$AAB" | tee /tmp/aab-verify.txt
          grep -q "jar verified" /tmp/aab-verify.txt
          ls -lh "$AAB"

      - name: Verify APK signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No keystore configured — APK is unsigned; add the four secrets to sign."
            exit 0
          fi
          # Release APKs carry APK Signature Scheme v2/v3 (no JAR manifest),
          # so jarsigner would report "unsigned". Verify with apksigner from
          # the Android build-tools instead — it checks the v2/v3 blocks that
          # Android actually uses for in-place updates.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-verify.txt
          grep -Eq "Verified using v[23] scheme.*: true" /tmp/apk-verify.txt
          ls -lh "$APK"

      # room.schemaLocation is written by the Room processor outside the KSP
      # task's declared outputs, so a FROM-CACHE kspDebugKotlin hit never
      # exports the schema JSON. Re-run KSP fresh to guarantee the export.
      - name: Export Room schema (KSP cache bypass)
        run: gradle kspDebugKotlin --rerun

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetguide-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room schema (version-controlled via repo — browser check)
        uses: actions/upload-artifact@v4
        with:
          name: vetguide-room-schemas
          path: app/schemas
          if-no-files-found: warn

      - name: Upload release AAB (signed when keystore secrets are set)
        uses: actions/upload-artifact@v4
        with:
          name: vetguide-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Signed with the same vetguide-release.jks as the AAB, so testers can
      # install it in-place over a previous release build (Room data kept).
      # The glob also matches app-release-unsigned.apk when no keystore is set.
      - name: Upload release APK (signed when keystore secrets are set)
        uses: actions/upload-artifact@v4
        with:
          name: vetguide-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

